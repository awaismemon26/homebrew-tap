# Once a day, checks every cask and formula in this tap for a newer release (each one's livecheck block)
# and opens a pull request that updates its version and checksum. Merge the PR to ship the update.
# Needs: Settings ▸ Actions ▸ General ▸ "Allow GitHub Actions to create and approve pull requests".
name: Bump versions

on:
  push:
    branches: [main]
    paths: [.github/workflows/autobump.yml]
  schedule:
    - cron: "35 2 * * *" # daily, 02:35 UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Bump casks and formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --tap="$TAP_NAME"
